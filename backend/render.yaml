services:
  - type: web
    name: plantcare-ai-api
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MODEL_PATH
        value: weights/vgg16_best.pth
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_IMAGE_MB
        value: "10"
      - key: LOG_LEVEL
        value: INFO
